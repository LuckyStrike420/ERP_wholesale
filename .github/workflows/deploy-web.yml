name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml", "supabase/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public values: the publishable key is designed to be shipped to browsers.
      # Access is enforced by Supabase auth + row-level security.
      VITE_SUPABASE_URL: https://pliesnqauuhraskygnqj.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_F6Dpllpy-jR-BJbm471_Zg_76zL_pzN
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The web app imports ../src/import/importer.ts, which resolves its packages from the repo root.
      - run: npm ci
        working-directory: .
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
